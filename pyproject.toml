[project]
name = "n3rve"
version = "1.0.0"
description = "Automated WPA/WPA2 passphrase recovery from captured handshakes and PMKIDs (authorized testing only)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rich==15.0.0",
    "prompt_toolkit==3.0.52",
    "scapy==2.7.0",
    "colorama==0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.2",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[project.scripts]
n3rve = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
